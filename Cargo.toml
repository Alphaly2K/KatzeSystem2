[package]
name = "katze-system2"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "LGPL-2.1-only"
description = "CatSystem2 2.6.1.90 script readers and interpreters"

[dependencies]
blowfish = "0.9.1"
encoding_rs = "0.8.35"
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
fontdue = { version = "=0.9.3", default-features = false, features = ["std"] }
ttf-parser = { version = "=0.25.1", default-features = false, features = ["std"] }
lewton = { version = "=0.10.2", default-features = false, features = ["ogg"] }
jpeg-decoder = { version = "=0.3.2", default-features = false }
jpeg-encoder = "=0.6.1"
image-webp = "=0.2.4"
png = "=0.17.16"
roxmltree = "0.20.0"

[build-dependencies]
cc = "=1.11.1"

[target.'cfg(target_os = "macos")'.dependencies]
metal = "=0.28.0"

[dev-dependencies]
chrono = { version = "=0.4.42", default-features = false, features = ["clock"] }
fontdb = { version = "=0.23.0", default-features = false, features = ["fs", "fontconfig"] }
sdl2 = { version = "=0.38.0", default-features = false, features = ["bundled", "static-link"] }
